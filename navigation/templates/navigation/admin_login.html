<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrator Sign In — Campus Navigation</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --border: #E2E8F0;
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --text: #0F172A;
      --text-muted: #64748B;
      --danger: #EF4444;
      --danger-bg: #FEF2F2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 400px;
      padding: 32px;
    }
    .logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .logo-badge {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .logo-badge svg { width: 22px; height: 22px; }
    h1 { font-size: 20px; font-weight: 600; color: var(--text); }
    .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .error-alert {
      background: var(--danger-bg);
      border: 1px solid #FECACA;
      color: var(--danger);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s ease;
      background: #fff;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .submit-btn {
      width: 100%;
      padding: 11px;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
      margin-top: 6px;
    }
    .submit-btn:hover {
      background: var(--primary-hover);
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
    }
    .back-link:hover { color: var(--primary); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-row">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon>
          <line x1="9" y1="3" x2="9" y2="18"></line>
          <line x1="15" y1="6" x2="15" y2="21"></line>
        </svg>
      </div>
      <div>
        <h1>Admin Portal</h1>
        <div class="subtitle">Campus Navigation System</div>
      </div>
    </div>

    {% if error %}
    <div class="error-alert">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{% url 'admin_login' %}?next={{ next }}">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Administrator Username</label>
        <input type="text" id="username" name="username" required autofocus placeholder="Username" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" />
      </div>

      <button type="submit" class="submit-btn">Sign In to Dashboard</button>
    </form>

    <a href="{% url 'home' %}" class="back-link">&larr; Return to Campus Map</a>
  </div>
</body>
</html>
