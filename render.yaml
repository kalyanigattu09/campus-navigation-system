services:
  - type: web
    name: campus-navigation
    env: python
    branch: campus-navigation-redesign
    buildCommand: "./build.sh"
    startCommand: "gunicorn campus_nav.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: campus-nav-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: campus-nav-db
    plan: free
